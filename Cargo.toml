[workspace]
members = ["crates/exp-core", "crates/capture", "crates/ocr", "crates/sysocr", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# OCR is hot and its scale search is slow unoptimized, even in tests.
[profile.dev.package.ocr]
opt-level = 3
